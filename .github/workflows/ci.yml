name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Validate monitoring configs parse
        run: python -c "import yaml,json,glob; [yaml.safe_load(open(f)) for f in glob.glob('monitoring/**/*.yml', recursive=True)+['docker-compose.yml']]; json.load(open('monitoring/grafana/dashboards/payops.json'))"
