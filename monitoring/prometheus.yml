global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: payops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["payops-api:8099"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Black-box probe of the readiness endpoint: this is the "is the service up for users" signal.
  - job_name: blackbox-ready
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://payops-api:8099/ready"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
